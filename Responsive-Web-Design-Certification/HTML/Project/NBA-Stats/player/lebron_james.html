<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../img/icon/nba-icon.webp">
        <title>LeBron James | Forward | Los Angeles Lakers | NBA.com</title>
    </head>
    <body>
        <main>
            <img src="../img/player/lebron_james.avif" alt="LeBron James's Official Image" width="275" height="200.95">
            <h1>
                Los Angeles Lakers | #23 | Forward
            </h1>
            <h2>
                LeBron James
            </h2>

            <!-- Official Statistics -->
            <h3>
                Official Statistics
            </h3>
            <!-- Points Per Game -->
            <strong>Points Per Game:</strong> <input type="box" size="1" title="Points-Per-Game" value="20.9" readonly>
            
            <!-- Rebounds Per Game -->
            <br/>
            <strong>Rebounds Per Game:</strong> <input type="box" size="1" title="Rebounds-Per-Game" value="6.1" readonly>
        
            <!-- Assists Per Game -->
            <br/>
            <strong>Assists Per Game:</strong> <input type="box" size="1" title="Assists-Per-Game" value="7.2" readonly>

            <!-- Official Player Profile -->
            <h3>
                Official Player Profile
            </h3>
            <!-- Height -->
            <strong>Height: </strong> <input type="box" size="1" title="Height-Inches" value="6'9" readonly> <input type="box" size="2" title="Height-Meters" value="2.06m" readonly>

            <!-- Weight -->
            <br/>
            <strong>Weight: </strong> <input type="box" size="1" title="Weight-Pounds" value="250lb" readonly> <input type="box" size="1" title="Weight-Kilograms" value="113kg" readonly>

            <!-- Country -->
            <br/>
            <strong>Country: </strong> <input type="box" size="1" title="Country" value="USA" readonly>

            <!-- Last Attended -->
            <br/>
            <strong>Last Attended: </strong> <input type="box" size="22" title="Last-Attended" value="St. Vincent-St. Mary HS (OH)" readonly>

            <!-- Age -->
            <br/>
            <strong>Age:</strong> <input type="box" size="4" title="Age" value="41 years" readonly>

            <!-- Birthdate -->
            <br/>
            <strong>Birthdate: </strong> <input type="box" size="14" title="Birthdate" value="December 30, 1984" readonly>

            <!-- Draft -->
            <br/>
            <strong>Draft: </strong> <input type="box" size="9" title="Draft" value="2003 R1 Pick 1" readonly>

            <!-- Experience -->
            <br/>
            <strong>Experience: </strong> <input type="box" size="4" title="Experience" value="22 Years" readonly>
        </main>
    </body>
</html>
