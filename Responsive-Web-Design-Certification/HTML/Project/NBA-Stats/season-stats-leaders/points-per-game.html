<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="../img/icon/nba-icon.webp">
        <title>Season Leaders | Stats | NBA.com</title>
    </head>
    <body>
        <main>     
            <h1>
                NBA Advanced Stats
            </h1>
            <h2>
                Stats Home / Players / Season Leaders
            </h2>
            <h3>
                Official Leaders
            </h3>
            <!-- Season -->
            <strong>Season: </strong> <input type="box" size="3" title="Season" value="2025-26" readonly>

            <!-- Season Type -->
            <br/>
            <strong>Season Type: </strong> <input type="box" size="3" title="Season-Type" value="Playoffs" readonly>

            <!-- Per Mode -->
            <br/>
            <strong>Per Game: </strong> <input type="box" size="5" title="Per-Mode" value="Per Game" readonly>

            <!-- Stat Category -->
            <br/>
            <strong>Stat Category: </strong> <input type="box" size="1" title="Stat-Category" value="PTS" readonly>

            <!-- Points Per Game Leaders Table -->
            <br/>
            <br/>
            <table border="1">
                <tr>
                    <th>
                        Player
                    </th>
                    <th>
                        Team
                    </th>
                    <th>
                        GP
                    </th>
                    <th>
                        Min
                    </th>
                    <th>
                        PTS
                    </th>
                    <th>
                        FGM
                    </th>
                    <th>
                        FGA
                    </th>
                    <th>
                        FG%
                    </th>
                    <th>
                        3PM
                    </th>
                    <th>
                        3PA
                    </th>
                    <th>
                        3P%
                    </th>
                    <th>
                        FTM
                    </th>
                    <th>
                        FTA
                    </th>
                    <th>
                        FT%
                    </th>
                    <th>
                        OREB
                    </th>
                    <th>
                        DREB
                    </th>
                    <th>
                        REB
                    </th>
                    <th>
                        AST
                    </th>
                    <th>
                        STL
                    </th>
                    <th>
                        BLK
                    </th>
                    <th>
                        TOV
                    </th>
                    <th>
                        EFF
                    </th>
                </tr>
            </table>
        </main>
    </body>
</html>
