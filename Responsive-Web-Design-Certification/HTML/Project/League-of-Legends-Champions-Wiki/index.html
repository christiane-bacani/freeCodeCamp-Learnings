<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Champions</title>
        <link rel="icon" href="assets\icons\league-of-legends-icon.svg">
        <link rel="stylesheet" href="assets/css/style.css">

        <!-- Hover Zoom Effect -->
        <style>
            main div {
                overflow: hidden;
                display: inline-block;
            }

            main div img {
                transition: transform 0.3s ease;
            }

            main div img:hover {
                transform: scale(1.08);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        </style>
    </head>
    <body>
        <header>
            <div class="center">
                <h1>Choose Your Champion</h1>
                <p>With over 170 champions in League of Legends, you might be wondering where to start – we’ll help <br/> you find one that’s just the right fit. Take this 3 question quiz to find a perfect champion for your<br/> playstyle – and instantly unlock them for free.</p>
                <button type="button" onclick="window.location.href='https://findmychamp.leagueoflegends.com/?rg_link=champions';">DISCOVER YOUR BEST MATCH</button>
            </div>
        </header>

        <br/>

        <main>
            <!-- Aatrox -->
            <div class="img-wrapper">
                <img src="assets/images/aatrox.avif" alt="Aatrox Official Image" width="326" height="435">
                <br/>
                <span>Aatrox</span>
            </div>
        </main>
    </body>
</html>
